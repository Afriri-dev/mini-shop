# Pipeline CI Products - prêt pour quand le dev Products aura commencé
# Pour l'instant : install + npm test (echo + exit 0)

name: Products CI

on:
  push:
    branches: [main, "feature/*"]
    paths:
      - "products-service/**"
  pull_request:
    branches: [main]
    paths:
      - "products-service/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: cd products-service && npm ci

      - name: Run tests
        run: cd products-service && npm test

      - name: Audit dependencies
        run: cd products-service && npm audit --audit-level=high || true
