# Pipeline CI/CD principal - version simplifiée
# Les étapes Kubernetes, push Docker, etc. peuvent être ajoutées plus tard

name: Mini-Shop CI/CD

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  auth-orders:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: shopdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install & test Auth
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: rootpassword
        run: |
          cd auth-service && pip install -r requirements.txt && python -m pytest tests/ -v

      - name: Install & test Orders
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: rootpassword
        run: |
          cd orders-service && pip install -r requirements.txt && python -m pytest tests/ -v

      - name: Audit Python deps
        run: |
          pip install pip-audit
          cd auth-service && pip-audit
          cd ../orders-service && pip-audit

  products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install & test Products
        run: |
          cd products-service && npm ci && npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend
        run: |
          test -f frontend/index.html && test -f frontend/login.html && test -f frontend/orders.html
          echo "Frontend structure OK"
