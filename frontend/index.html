<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mini-Shop - Inscription</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Mini-Shop - Inscription</h1>

  <!-- Formulaire d'inscription -->
  <form id="signup-form" onsubmit="event.preventDefault(); register();">
    <input id="reg-username" name="username" placeholder="Nom d'utilisateur" required>
    <input id="reg-email" name="email" type="email" placeholder="Email" required>
    <input id="reg-password" name="password" type="password" placeholder="Mot de passe" required>
    <input id="reg-confirm" name="confirm" type="password" placeholder="Confirmer mot de passe" required>
    <button type="submit">S'inscrire</button>
  </form>

  <p>Déjà inscrit ? <a href="login.html">Se connecter</a></p>

  <div id="result"></div>

  <!-- Inclusion du script de validation et d'inscription -->
  <script src="js/auth.js"></script>
</body>
</html>
